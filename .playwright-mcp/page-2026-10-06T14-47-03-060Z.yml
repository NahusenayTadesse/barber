          - generic [ref=f1e121]:
            - generic [ref=f1e122]:
              - heading "Getting Started" [level=2] [ref=f1e123]
              - paragraph [ref=f1e124]: Signing in, finding your way around, and managing your account.
              - generic [ref=f1e125]:
                - paragraph [ref=f1e126]: The dashboard is the private area where you control what appears on your public website and where you receive enrollments and messages from customers. You must be signed in to see it. If you are not, you will be sent to the login page.
                - generic [ref=f1e127]:
                  - heading "Signing in" [level=3] [ref=f1e128]
                  - list [ref=f1e129]:
                    - listitem [ref=f1e130]: Go to the /login page of your website.
                    - listitem [ref=f1e131]: Enter your email and password and press Login.
                    - listitem [ref=f1e132]: You will land on the Dashboard Overview page.
                - generic [ref=f1e133]:
                  - heading "Finding your way around" [level=3] [ref=f1e134]
                  - list [ref=f1e135]:
                    - listitem [ref=f1e136]: "Sidebar (left): links to every section - Dashboard, Enrollments, Services, Gallery, Opening Hours, Courses, Messages and Help."
                    - listitem [ref=f1e137]: "Sidebar toggle (top-left button): opens and closes the sidebar. On a phone or tablet the sidebar is hidden until you press this button."
                    - listitem [ref=f1e138]: "Logo (top of sidebar): opens your public website in a new tab so you can check your changes."
                    - listitem [ref=f1e139]: "Account menu (top-right circle with your initial): change your password or log out."
                - generic [ref=f1e140]:
                  - heading "Changing your password" [level=3] [ref=f1e141]
                  - list [ref=f1e142]:
                    - listitem [ref=f1e143]: Click the circle with your initial at the top-right.
                    - listitem [ref=f1e144]: Choose Change Password.
                    - listitem [ref=f1e145]: Enter your current password, then the new password twice.
                    - listitem [ref=f1e146]: Press Change Password.
                - paragraph [ref=f1e150]:
                  - strong [ref=f1e151]: "Warning:"
                  - text: "A new password must be at least 8 characters and include an uppercase letter, a lowercase letter, a number and a special character (for example ! or #)."
                - paragraph [ref=f1e155]:
                  - strong [ref=f1e156]: "Tip:"
                  - text: Always log out from the account menu when you use a shared or public computer.
            - generic [ref=f1e157]:
              - heading "Dashboard Overview" [level=2] [ref=f1e158]
              - paragraph [ref=f1e159]: The three summary cards on the home page of the dashboard.
              - generic [ref=f1e160]:
                - paragraph [ref=f1e161]: The Dashboard page gives you a quick look at what happened today. Counts start again from zero at midnight.
                - generic [ref=f1e162]:
                  - heading "The cards" [level=3] [ref=f1e163]
                  - list [ref=f1e164]:
                    - listitem [ref=f1e165]: "New Enrolments: how many people enrolled on a course today."
                    - listitem [ref=f1e166]: "Inquiries: how many messages were sent through the Contact form on your website today."
                    - listitem [ref=f1e167]: "Total Engagement: new enrolments and inquiries added together."
                - paragraph [ref=f1e171]:
                  - strong [ref=f1e172]: "Tip:"
                  - text: Check the Overview first thing every morning, then open Enrollments or Messages to see the details.
            - generic [ref=f1e173]:
              - heading "Using Tables (Search, Sort, Filter, Export)" [level=2] [ref=f1e174]
              - paragraph [ref=f1e175]: Everything that works the same way on the Enrollments, Services, Courses and Messages lists.
              - generic [ref=f1e176]:
                - paragraph [ref=f1e177]: Most pages show a table. The tools above every table are the same everywhere, so you only need to learn them once.
                - generic [ref=f1e178]:
                  - heading "Table tools" [level=3] [ref=f1e179]
                  - list [ref=f1e180]:
                    - listitem [ref=f1e181]: "Search Table: type in the search box to instantly show only the rows that contain your text in any column."
                    - listitem [ref=f1e182]: "Columns: choose which columns to show or hide. Useful on small screens."
                    - listitem [ref=f1e183]: "Pages: choose how many rows to show at once. Use Previous and Next at the bottom to move between pages."
                    - listitem [ref=f1e184]: "Results: shows how many rows match your current search and filters."
                    - listitem [ref=f1e185]: "Download button (arrow icon): export the table as a PDF or as a CSV file that opens in Excel or Google Sheets."
                    - listitem [ref=f1e186]: "Column headings: click a heading that has arrows to sort by that column. Click again to reverse the order."
                    - listitem [ref=f1e187]: "Copy: click a phone number or email address in the table to copy it."
                    - listitem [ref=f1e188]: "Resize: drag the handle on the right edge of the table to make it narrower or wider on large screens."
                - generic [ref=f1e189]:
                  - heading "Filtering" [level=3] [ref=f1e190]
                  - list [ref=f1e191]:
                    - listitem [ref=f1e192]: Open the Filter menu above the table.
                    - listitem [ref=f1e193]: Pick one or more values for any filter (for example a course or a status).
                    - listitem [ref=f1e194]: The table updates straight away. Use the reset button to clear all filters.
                - paragraph [ref=f1e198]:
                  - strong [ref=f1e199]: "Tip:"
                  - text: Search and filters apply to the exported file too. Filter first, then download, to export only the rows you need.
            - generic [ref=f1e200]:
              - heading "Enrollments" [level=2] [ref=f1e201]
              - paragraph [ref=f1e202]: See everyone who has enrolled on one of your courses.
              - generic [ref=f1e203]:
                - paragraph [ref=f1e204]: "The Enrollments page lists every person who enrolled through the website. It is a read-only list: enrollments are created by customers when they sign up on the Courses page, so there is nothing to add here."
                - generic [ref=f1e205]:
                  - heading "What each column means" [level=3] [ref=f1e206]
                  - list [ref=f1e207]:
                    - listitem [ref=f1e208]: "Name, Phone, Email: the contact details the person entered."
                    - listitem [ref=f1e209]: "Course: the course they enrolled on."
                    - listitem [ref=f1e210]: "Payment Option: the amount (in pounds) of the payment option they chose."
                    - listitem [ref=f1e211]: "Status: a coloured badge - green for confirmed or paid, yellow for pending, red for cancelled or unpaid."
                    - listitem [ref=f1e212]: "Enrolled At: the date they enrolled."
                - paragraph [ref=f1e213]: The heading shows the total number of enrollments. You can filter by status, course, payment option and date, search by name or phone, and export the list as PDF or CSV (see Using Tables).
                - paragraph [ref=f1e217]:
                  - strong [ref=f1e218]: "Tip:"
                  - text: Click a phone number or email to copy it, then paste it into WhatsApp, your phone or your email app.
            - generic [ref=f1e219]:
              - heading "Courses" [level=2] [ref=f1e220]
              - paragraph [ref=f1e221]: Add, view, edit, hide and delete the courses shown on your website.
              - generic [ref=f1e222]:
                - paragraph [ref=f1e223]: Courses are the training programmes people can enrol on. Use Courses > All Courses in the sidebar to see them, and Courses > Add Course to create a new one.
                - generic [ref=f1e224]:
                  - heading "Adding a course" [level=3] [ref=f1e225]
                  - list [ref=f1e226]:
                    - listitem [ref=f1e227]: In the sidebar open Courses, then Add Course.
                    - listitem [ref=f1e228]: Fill in the form. Only Course Name is required; the other fields are optional but make your course page more useful.
                    - listitem [ref=f1e229]: Add the price options if the form shows them (an amount and a label such as "Full payment").
                    - listitem [ref=f1e230]: Press the Add button at the bottom. A green message confirms it was saved.
                - generic [ref=f1e231]:
                  - heading "Course fields" [level=3] [ref=f1e232]
                  - list [ref=f1e233]:
                    - listitem [ref=f1e234]: "Course Name: required."
                    - listitem [ref=f1e235]: "Course Level and Duration: for example \"Beginner\" and \"6 weeks\"."
                    - listitem [ref=f1e236]: "Base Price: the full price of the course."
                    - listitem [ref=f1e237]: "Minimum Price to Enroll and Minimum Price Message: the deposit needed to book a place, and the text explaining it to customers."
                    - listitem [ref=f1e238]: "Target Audience and Experience Level: who the course is for and what they should already know."
                    - listitem [ref=f1e239]: "Course Description: a longer description shown on the course page."
                - generic [ref=f1e240]:
                  - heading "Editing or hiding a course" [level=3] [ref=f1e241]
                  - list [ref=f1e242]:
                    - listitem [ref=f1e243]: Open Courses > All Courses and click the three dots in the Actions column.
                    - listitem [ref=f1e244]: Choose View [course]'s Details. The details page opens in a new tab.
                    - listitem [ref=f1e245]: Press Edit, change what you need and press Save Changes.
                    - listitem [ref=f1e246]: To hide a course from the website without deleting it, set Status to Inactive and save.
                - paragraph [ref=f1e250]:
                  - strong [ref=f1e251]: "Warning:"
                  - text: Delete (on the course details page) removes the course permanently. If you only want to stop taking new enrollments, set the course to Inactive instead.
            - generic [ref=f1e252]:
              - heading "Services" [level=2] [ref=f1e253]
              - paragraph [ref=f1e254]: Manage the barber services, prices and booking links on your website.
              - generic [ref=f1e255]:
                - paragraph [ref=f1e256]: The Services page controls the list of services (for example haircuts and beard trims) that visitors see on the website.
                - generic [ref=f1e257]:
                  - heading "Adding a service" [level=3] [ref=f1e258]
                  - list [ref=f1e259]:
                    - listitem [ref=f1e260]: Press the Add Service button at the top of the page.
                    - listitem [ref=f1e261]: Enter the Name of Service (required, 2 to 50 characters).
                    - listitem [ref=f1e262]: Add the Price, a Description and the Booking Link (the full web address customers should use to book).
                    - listitem [ref=f1e263]: Upload an image for the service. Images must be smaller than 10 MB.
                    - listitem [ref=f1e264]: Press Add Service.
                - generic [ref=f1e265]:
                  - heading "Editing a service" [level=3] [ref=f1e266]
                  - list [ref=f1e267]:
                    - listitem [ref=f1e268]: Find the service in the table (use the search box if the list is long).
                    - listitem [ref=f1e269]: Click the service name, or press the pencil button in the Edit column.
                    - listitem [ref=f1e270]: Change the details and save. You only need to upload a new image if you want to replace the current one.
                - generic [ref=f1e271]:
                  - heading "Deleting a service" [level=3] [ref=f1e272]
                  - list [ref=f1e273]:
                    - listitem [ref=f1e274]: Press the red bin button in the Delete column.
                    - listitem [ref=f1e275]: Read the confirmation message and confirm.
                - paragraph [ref=f1e279]:
                  - strong [ref=f1e280]: "Tip:"
                  - text: Click a service image in the table to see it full size. The Booking Link column opens the link in a new tab so you can test that it works.
                - paragraph [ref=f1e284]:
                  - strong [ref=f1e285]: "Warning:"
                  - text: Deleting a service cannot be undone and it disappears from the website straight away.
            - generic [ref=f1e286]:
              - heading "Gallery" [level=2] [ref=f1e287]
              - paragraph [ref=f1e288]: Choose the images that scroll across your homepage.
              - generic [ref=f1e289]:
                - paragraph [ref=f1e290]: The Gallery page controls the pictures that scroll on your homepage. The number of images currently in the gallery is shown in the card title.
                - generic [ref=f1e291]:
                  - heading "Adding images" [level=3] [ref=f1e292]
                  - list [ref=f1e293]:
                    - listitem [ref=f1e294]: Drop image files onto the upload area, or click it to choose files from your device. You can select several at once.
                    - listitem [ref=f1e295]: Each image must be smaller than 10 MB.
                    - listitem [ref=f1e296]: Press Save Gallery. Nothing is published until you save.
                - generic [ref=f1e297]:
                  - heading "Removing images" [level=3] [ref=f1e298]
                  - list [ref=f1e299]:
                    - listitem [ref=f1e300]: Press the X in the corner of an image to take it out of the gallery.
                    - listitem [ref=f1e301]: Use the clear button to remove all newly selected files at once.
                    - listitem [ref=f1e302]: Press Save Gallery to apply the change.
                - paragraph [ref=f1e306]:
                  - strong [ref=f1e307]: "Tip:"
                  - text: Use bright, landscape or square photos of your best work. Smaller files load faster for your visitors.
            - generic [ref=f1e308]:
              - heading "Opening Hours" [level=2] [ref=f1e309]
              - paragraph [ref=f1e310]: Set the weekly opening times shown across the website.
              - generic [ref=f1e311]:
                - paragraph [ref=f1e312]: The hours you set here are shown on the home page, in the footer and on the contact page, so you only need to change them in one place.
                - generic [ref=f1e313]:
                  - heading "Updating your hours" [level=3] [ref=f1e314]
                  - list [ref=f1e315]:
                    - listitem [ref=f1e316]: Open Opening Hours in the sidebar. All seven days are listed.
                    - listitem [ref=f1e317]: For a day you are closed, tick Closed. The time boxes disappear.
                    - listitem [ref=f1e318]: For an open day, type the Opens and Closes times as you want visitors to read them, for example 9AM and 6PM.
                    - listitem [ref=f1e319]: Press Save Hours.
                - paragraph [ref=f1e323]:
                  - strong [ref=f1e324]: "Tip:"
                  - text: Keep these hours in sync with your Google Business Profile so customers see the same times everywhere.
            - generic [ref=f1e325]:
              - heading "Messages" [level=2] [ref=f1e326]
              - paragraph [ref=f1e327]: Read and manage enquiries sent through the website Contact form.
              - generic [ref=f1e328]:
                - paragraph [ref=f1e329]: Every time someone fills in the Contact form on your website, their message appears here with their name, phone number, email, subject, the message and the time it was sent.
                - generic [ref=f1e330]:
                  - heading "Working through messages" [level=3] [ref=f1e331]
                  - list [ref=f1e332]:
                    - listitem [ref=f1e333]: Open Messages in the sidebar.
                    - listitem [ref=f1e334]: Click the long message text to read it in full.
                    - listitem [ref=f1e335]: Click a phone number or email to copy it, then reply from your own phone or email app.
                    - listitem [ref=f1e336]: Use the Filter menu to show only one subject, or search for a name.
                    - listitem [ref=f1e337]: When you have dealt with a message, press the bin button in the Delete column and confirm.
                - paragraph [ref=f1e341]:
                  - strong [ref=f1e342]: "Tip:"
                  - text: Export messages to CSV from the download button if you want to keep a record before deleting them.
                - paragraph [ref=f1e346]:
                  - strong [ref=f1e347]: "Warning:"
                  - text: Deleted messages cannot be recovered.
            - generic [ref=f1e348]:
              - heading "Troubleshooting & Tips" [level=2] [ref=f1e349]
              - paragraph [ref=f1e350]: Quick answers to common problems.
              - generic [ref=f1e351]:
                - generic [ref=f1e352]:
                  - heading "Common problems" [level=3] [ref=f1e353]
                  - list [ref=f1e354]:
                    - listitem [ref=f1e355]: "My change did not appear on the website: make sure you pressed the Save button and saw the green confirmation message, then refresh the website page."
                    - listitem [ref=f1e356]: "A form shows red text: a required field is empty or a value is not valid. Fix the highlighted fields and try again."
                    - listitem [ref=f1e357]: "An image will not upload: check that the file is an image and is smaller than 10 MB."
                    - listitem [ref=f1e358]: "I was sent back to the login page: your session ended. Sign in again."
                    - listitem [ref=f1e359]: "The table looks cramped on my phone: use the Columns menu to hide columns you do not need."
                    - listitem [ref=f1e360]: "I forgot my password: ask the site administrator to reset it, then change it from the account menu."
                - generic [ref=f1e361]:
                  - heading "Good habits" [level=3] [ref=f1e362]
                  - list [ref=f1e363]:
                    - listitem [ref=f1e364]: Check your public website after every change.
                    - listitem [ref=f1e365]: Use Inactive instead of Delete when you may want something back later.
                    - listitem [ref=f1e366]: Export enrollments and messages regularly as a backup.
